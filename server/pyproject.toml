[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E712", "E402"]

[tool.pyright]
include = ["app"]
exclude = ["tests", "**/__pycache__", ".venv"]
pythonVersion = "3.10"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
